<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speisekarte</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 15px;
    }
    .description {
      font-size: 0.9em;
      color: #666;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <h1>Speisekarte</h1>

  <div class="menu-item">
    <span><b>Pizza Margherita</b></span>
    <span><b>8,50 €</b></span>
  </div>
  <div class="description">Tomatensauce, Mozzarella und frischer Basilikum</div>

  <div class="menu-item">
    <span><b>Spaghetti Carbonara</b></span>
    <span><b>11,90 €</b></span>
  </div>
  <div class="description">Guanciale, Eigelb, Pecorino Romano und schwarzer Pfeffer</div>

  <div class="menu-item">
    <span><b>Tiramisu</b></span>
    <span><b>5,00 €</b></span>
  </div>
  <div class="description">Hausgemacht mit Löffelbiskuits, Espresso und Mascarpone</div>

</body>
</html>
